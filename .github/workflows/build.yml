name: Build TichTienApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o TichTienApp_iOS_Project.zip
          ls -la

      - name: Build iOS app
        run: |
          xcodebuild \
            -project TichTienApp/TichTienApp.xcodeproj \
            -scheme TichTienApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TichTienApp.app Payload/
          zip -r TichTienApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TichTienApp-IPA
          path: TichTienApp-unsigned.ipa
